name: Get PR Diff
description: Generate a source PR diff with explicit generated-lockfile exclusions and budget reporting.
inputs:
  base_sha:
    description: Base commit SHA for the PR.
    required: true
  head_sha:
    description: Head commit SHA for the PR.
    required: true
  max_bytes:
    description: Maximum diff size in bytes before truncation.
    required: false
    default: "524288"
outputs:
  diff_path:
    description: Path to the generated diff file.
    value: ${{ steps.diff.outputs.diff_path }}
  linediff_path:
    description: Path to the line-numbered diff file.
    value: ${{ steps.diff.outputs.linediff_path }}
  diff_bytes:
    description: Source diff size before truncation, excluding the documented generated lockfile.
    value: ${{ steps.diff.outputs.diff_bytes }}
  max_bytes:
    description: Configured maximum diff size in bytes.
    value: ${{ steps.diff.outputs.max_bytes }}
  truncated:
    description: Whether the diff was truncated.
    value: ${{ steps.diff.outputs.truncated }}
  full_diff_bytes:
    description: Full diff size before generated-lockfile filtering.
    value: ${{ steps.diff.outputs.full_diff_bytes }}
  excluded_files:
    description: Generated lockfile omitted from AI source review, or empty.
    value: ${{ steps.diff.outputs.excluded_files }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      run: |
        set -euo pipefail

        BASE_SHA="${{ inputs.base_sha }}"
        HEAD_SHA="${{ inputs.head_sha }}"
        MAX_BYTES="${{ inputs.max_bytes }}"

        echo "Base: $BASE_SHA"
        echo "Head: $HEAD_SHA"

        # Only this exact generated file is covered by our npm malware gate.
        # Other lockfiles, and non-regular files at this path, remain reviewable.
        git diff --no-ext-diff --no-textconv --unified=3 "$BASE_SHA" "$HEAD_SHA" > pr_full.diff
        EXCLUDED_FILES=""
        REGULAR_LOCKFILE=true
        for REF in "$BASE_SHA" "$HEAD_SHA"; do
          MODE=$(git ls-tree "$REF" -- frontend/package-lock.json | cut -d ' ' -f 1)
          if [ -n "$MODE" ] && [ "$MODE" != '100644' ]; then
            REGULAR_LOCKFILE=false
          fi
        done
        if [ "$REGULAR_LOCKFILE" = true ]; then
          git diff --no-ext-diff --no-textconv --unified=3 "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude,top)frontend/package-lock.json' > pr.diff
          EXCLUDED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- frontend/package-lock.json)
        else
          cp pr_full.diff pr.diff
        fi
        FULL_BYTES=$(wc -c < pr_full.diff)
        export EXCLUDED_FILES

        # Truncate if it's huge so we don't blow up token limits
        ACTUAL_BYTES=$(wc -c < pr.diff || echo 0)
        TRUNCATED=false
        if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
          head -c "$MAX_BYTES" pr.diff > pr_truncated.diff
          echo "::warning::Diff was too large ($ACTUAL_BYTES bytes). Truncated to $MAX_BYTES bytes."
          mv pr_truncated.diff pr.diff
          TRUNCATED=true
        fi

        echo "Diff size:"
        wc -c pr.diff

        # Build a line-numbered diff for inline review comments
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import re

        diff_path = "pr.diff"
        out_path = "pr_lines.diff"

        hunk_re = re.compile(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@")
        new_line = None

        excluded = [os.environ["EXCLUDED_FILES"]] if os.environ["EXCLUDED_FILES"] else []
        scope = (
            "AI REVIEW SCOPE\n"
            f"Full diff bytes: {Path('pr_full.diff').stat().st_size}\n"
            f"Generated lockfile payloads excluded: {json.dumps(excluded)}\n"
            "Excluded payloads have NOT been inspected by this AI source review. "
            "Dependency Review and npm malware review remain independent required gates.\n"
        )
        if not Path(diff_path).stat().st_size:
            scope += (
                "No source diff remains (lockfile-only or empty change). "
                "Do not infer dependency safety from an empty source diff; "
                "use the independent scanner evidence for dependency conclusions.\n"
            )
        scope += (
            "DIFF LEGEND: A<number> is ADDED current RIGHT-side source; "
            "R<number> is unchanged current context; "
            "D is DELETED old source, not active code.\n\n"
        )
        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as report:
                report.write(scope)

        with open(diff_path, "r", encoding="utf-8", errors="replace") as f, open(
            out_path, "w", encoding="utf-8"
        ) as out:
            out.write(scope)
            for raw in f:
                line = raw.rstrip("\n")
                if line.startswith("@@ "):
                    m = hunk_re.search(line)
                    if m:
                        new_line = int(m.group(1))
                    out.write(line + "\n")
                    continue

                if line.startswith("diff --git") or line.startswith("index ") or line.startswith("--- ") or line.startswith("+++ "):
                    out.write(line + "\n")
                    continue

                if line.startswith("+") and not line.startswith("+++"):
                    if new_line is not None:
                        out.write(f"A{new_line}: {line[1:]}\n")
                        new_line += 1
                    else:
                        out.write(line + "\n")
                    continue

                if line.startswith(" ") and new_line is not None:
                    out.write(f"R{new_line}: {line[1:]}\n")
                    new_line += 1
                    continue

                if line.startswith("-") and not line.startswith("---"):
                    out.write(f"D: {line[1:]}\n")
                    continue

                out.write(line + "\n")
        PY

        {
          echo "diff_path=pr.diff"
          echo "linediff_path=pr_lines.diff"
          echo "diff_bytes=$ACTUAL_BYTES"
          echo "full_diff_bytes=$FULL_BYTES"
          echo "excluded_files=$EXCLUDED_FILES"
          echo "max_bytes=$MAX_BYTES"
          echo "truncated=$TRUNCATED"
        } >> "$GITHUB_OUTPUT"
