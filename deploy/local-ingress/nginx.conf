events {}

stream {
  upstream rejected_https {
    server 127.0.0.1:1;
  }

  upstream notoli_https {
    server host.docker.internal:8442;
  }

  upstream macromapper_https {
    server host.docker.internal:8443;
  }

  upstream fullstacktemplate_https {
    server host.docker.internal:8444;
  }

  map $ssl_preread_server_name $application_upstream {
    notoli.localhost notoli_https;
    notoli.judeandrewalaba.com notoli_https;
    macromapper.localhost macromapper_https;
    macromapper.judeandrewalaba.com macromapper_https;
    fullstacktemplate.localhost fullstacktemplate_https;
    default rejected_https;
  }

  server {
    listen 443;
    listen [::]:443;

    proxy_pass $application_upstream;
    ssl_preread on;
  }
}

http {
  server {
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
  }
}
