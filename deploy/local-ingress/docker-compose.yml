name: fullstacktemplate-local-ingress

services:
  ingress:
    image: nginx:alpine
    container_name: local-app-ingress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always
