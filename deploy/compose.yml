# Built application images with local HTTPS; rebuild after source changes.
# Infrastructure owns production ingress.
name: fullstacktemplate

services:
  proxy:
    image: nginx:alpine
    container_name: fullstacktemplate-proxy
    environment:
      LOCAL_SERVER_NAME: fullstacktemplate.localhost localhost
      LOCAL_HTTPS_ORIGIN: ${FULLSTACKTEMPLATE_HTTPS_ORIGIN:-https://fullstacktemplate.localhost}
      NGINX_ENVSUBST_FILTER: ^LOCAL_(SERVER_NAME|HTTPS_ORIGIN)$$
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FULLSTACKTEMPLATE_CERTS_DIR:-../certs}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${FULLSTACKTEMPLATE_HTTP_PORT:-80}:80"
      - "127.0.0.1:${FULLSTACKTEMPLATE_HTTPS_PORT:-443}:443"
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      default:
      backend_private:
        ipv4_address: 172.30.90.2

  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    image: ghcr.io/vanillaicecube/fullstacktemplate-backend:latest
    container_name: fullstacktemplate-backend
    volumes:
      # Requires an existing file; follow missing-only setup in deploy/README.md.
      - type: bind
        source: ./db.sqlite3
        target: /backend/db.sqlite3
        bind:
          create_host_path: false
    env_file: .env
    environment:
      DJANGO_SQLITE_PATH: /backend/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,fullstacktemplate.localhost
      DJANGO_CORS_ALLOWED_ORIGINS: ${FULLSTACKTEMPLATE_HTTPS_ORIGIN:-https://fullstacktemplate.localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${FULLSTACKTEMPLATE_HTTPS_ORIGIN:-https://fullstacktemplate.localhost}
      DJANGO_FRONTEND_BASE_URL: ${FULLSTACKTEMPLATE_HTTPS_ORIGIN:-https://fullstacktemplate.localhost}
      DJANGO_MCP_BASE_URL: ${FULLSTACKTEMPLATE_HTTPS_ORIGIN:-https://fullstacktemplate.localhost}
      DJANGO_TRUSTED_PROXY_IPS: 172.30.90.2
    networks:
      backend_private:
        ipv4_address: 172.30.90.3
      backend_egress:
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_MCP_ENABLED: ${DJANGO_MCP_ENABLED:-0}
    image: ghcr.io/vanillaicecube/fullstacktemplate-frontend:latest
    container_name: fullstacktemplate-frontend
    restart: always
    depends_on:
      - backend

networks:
  backend_private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/29
  # SMTP and other outbound backend traffic retain Internet access.
  backend_egress:
